<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Supply Chain Analytics Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap">
<style>
/* Layout: fixed left rail (pillars) + scrolling control-room canvas; hub hero, pillar grid, per-pillar tool catalogs */
:root{
  color-scheme: dark;
  --bg:#000415; --bg-2:#010B29; --bg-3:#031340; --lift:#06205D;
  --panel:rgba(6,32,93,.28); --panel-hi:rgba(7,56,142,.32);
  --line:#1d2b4a; --line-hi:#374662; --circuit:#2D6CB4;
  --text:#F9FBFD; --mist:#C3CFDF; --muted:#9BA9C2; --label:#6f9cc4;
  --accent:#47ABE0; --neon:#5AB2F3; --ice:#85BAE8; --frost:#BCDFF3; --violet:#7B6CF6;
  --ok:#3FCF9A; --warn:#F2B84B; --crit:#F0646C;
  --f-display:"Exo 2","Montserrat",system-ui,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-track:"Montserrat","Inter",sans-serif;
  --rail:252px;
  --glow:0 0 12px rgba(90,178,243,.5);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:radial-gradient(ellipse 80% 60% at 70% 0%, var(--lift) 0%, var(--bg-3) 25%, var(--bg-2) 50%, var(--bg) 85%) fixed, var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px;border-radius:6px}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- side rail ---------- */
.rail{position:fixed;top:0;bottom:0;left:0;width:calc(var(--rail) + env(safe-area-inset-left,0px));z-index:50;
  padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(1,11,41,.96),rgba(0,4,21,.98));border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:18px;overflow-y:auto;transition:transform .3s ease}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;text-decoration:none}
.brand-mark{width:36px;height:36px;flex:none}
.brand-txt{font-family:var(--f-display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px;line-height:1.1}
.brand-txt span{display:block;color:var(--neon);font-size:11px;letter-spacing:.18em;font-weight:700}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-h{font-family:var(--f-track);font-weight:600;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--label);padding:8px 10px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--mist);
  font-family:var(--f-label);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;position:relative;transition:background .2s,color .2s}
.nav a svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:rgba(71,171,224,.08);color:var(--text)}
.nav a[aria-current="page"]{background:linear-gradient(90deg,rgba(71,171,224,.2),rgba(71,171,224,.02));color:var(--text)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--neon);box-shadow:var(--glow)}
.nav a[aria-current="page"] svg{stroke:var(--neon);filter:drop-shadow(0 0 4px rgba(90,178,243,.7))}
.nav .count{margin-left:auto;font-family:var(--f-body);font-size:11px;font-weight:500;letter-spacing:0;color:var(--muted);
  border:1px solid var(--line-hi);border-radius:10px;padding:0 7px;font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.rail-foot b{color:var(--ok);font-weight:600}
.dot-live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 8px var(--ok);animation:pulse 2.4s ease-in-out infinite}

/* ---------- topbar (mobile) ---------- */
.topbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;align-items:center;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(0,4,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.menu-btn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line-hi);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.menu-btn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round}
.scrim{display:none}

/* ---------- main ---------- */
main{margin-left:calc(var(--rail) + env(safe-area-inset-left,0px));min-width:0}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.kicker{font-family:var(--f-track);font-weight:600;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--label)}
.ruled{display:flex;align-items:center;gap:14px}
.ruled::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--circuit),transparent)}
h1,h2,h3{margin:0;text-wrap:balance}
.d-title{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;line-height:.98}
.accent{color:#4FA9EE;text-shadow:0 0 18px rgba(79,169,238,.35)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:center;padding-block:8px 28px}
.hero h1{font-size:clamp(34px,5vw,64px);margin:14px 0 18px}
.hero h1 .connector{display:block;font-size:.34em;letter-spacing:.3em;color:var(--mist);margin:.5em 0 .35em;font-weight:700}
.hero p.lede{color:var(--mist);max-width:52ch;font-size:16px;margin:0 0 22px}
.hub-wrap{position:relative;aspect-ratio:1.15/1;max-width:100%;min-width:0}
#hub{position:absolute;inset:0;width:100%;height:100%}
.search{display:flex;align-items:center;gap:10px;max-width:520px;padding:4px 6px 4px 14px;border-radius:10px;
  border:1px solid rgba(133,186,232,.3);background:rgba(1,11,41,.7);box-shadow:inset 0 0 18px rgba(31,108,202,.15)}
.search svg{width:18px;height:18px;stroke:var(--ice);fill:none;stroke-width:1.8;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;padding:10px 0;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.search kbd{font-family:var(--f-body);font-size:11px;color:var(--muted);border:1px solid var(--line-hi);border-radius:5px;padding:2px 6px}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:24px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.stat span{font-family:var(--f-label);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* search results */
.results{margin:6px 0 28px;display:grid;gap:8px}
.result{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:10px;
  background:rgba(1,11,41,.6);border:1px solid var(--line);text-decoration:none}
.result:hover{border-color:var(--circuit)}
.result small{color:var(--muted)}

/* pillar grid */
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:12px 0 18px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:22px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.pillar{position:relative;display:flex;flex-direction:column;text-decoration:none;border-radius:14px;overflow:hidden;
  border:1px solid rgba(133,186,232,.18);background:linear-gradient(165deg,rgba(7,56,142,.28),rgba(1,11,41,.55) 60%);
  transition:transform .25s ease,border-color .25s,box-shadow .25s}
.pillar:hover,.pillar:focus-visible{transform:translateY(-3px);border-color:rgba(133,186,232,.5);box-shadow:0 10px 40px rgba(31,108,202,.25)}
.pillar .vis{aspect-ratio:16/10;max-width:100%;border-bottom:1px solid var(--line);background:
  radial-gradient(ellipse at 50% 60%,rgba(7,56,142,.45),transparent 70%),
  repeating-linear-gradient(0deg,transparent 0 19px,rgba(45,108,180,.08) 19px 20px),
  repeating-linear-gradient(90deg,transparent 0 19px,rgba(45,108,180,.08) 19px 20px)}
.pillar .vis svg{display:block;width:100%;height:100%}
.pillar .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pillar h3{font-family:var(--f-label);font-weight:700;font-size:21px;letter-spacing:.07em;text-transform:uppercase}
.pillar p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
.pillar .foot{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ice);
  font-family:var(--f-track);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.pillar .foot i{font-style:normal;transition:transform .2s}
.pillar:hover .foot i{transform:translateX(4px)}

.help-band{margin-top:36px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.help{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:14px;border:1px solid var(--line-hi);background:rgba(1,11,41,.6);text-decoration:none}
.help:hover{border-color:var(--circuit)}
.node{width:52px;height:52px;flex:none;border-radius:50%;border:2px solid var(--neon);display:grid;place-items:center;
  box-shadow:var(--glow),inset 0 0 14px rgba(90,178,243,.35);background:rgba(3,19,64,.7)}
.node svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.help b{font-family:var(--f-label);font-size:19px;letter-spacing:.06em;text-transform:uppercase;display:block}
.help span{color:var(--muted);font-size:13.5px}

/* pillar view */
.p-head{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:28px}
.p-head h1{font-size:clamp(32px,4.4vw,54px);margin:12px 0 14px}
.p-head p{color:var(--mist);max-width:58ch;margin:0}
.p-vis{border-radius:16px;border:1px solid rgba(133,186,232,.22);overflow:hidden;aspect-ratio:16/10;max-width:100%;
  background:radial-gradient(ellipse at 50% 55%,rgba(7,56,142,.55),rgba(1,11,41,.7) 70%);box-shadow:0 0 50px rgba(31,108,202,.18)}
.p-vis svg{display:block;width:100%;height:100%}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chip{border:1px solid var(--line-hi);background:rgba(1,11,41,.6);color:var(--mist);border-radius:999px;padding:6px 14px;cursor:pointer;
  font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.chip[aria-pressed="true"]{border-color:var(--neon);color:var(--text);background:rgba(71,171,224,.16);box-shadow:var(--glow)}
.note{font-size:12.5px;color:var(--muted);margin-left:auto}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tool{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:12px;border:1px solid var(--line-hi);
  background:linear-gradient(160deg,rgba(46,67,119,.28),rgba(1,11,41,.55));min-width:0}
.tool-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-family:var(--f-label);font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ice);
  border:1px solid rgba(133,186,232,.35);border-radius:5px;padding:1px 8px}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;display:inline-flex;align-items:center;gap:6px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.live{color:var(--ok);background:rgba(63,207,154,.1)}
.pill.beta{color:var(--warn);background:rgba(242,184,75,.1)}
.pill.planned{color:var(--muted);background:rgba(155,169,194,.1)}
.tool h3{font-family:var(--f-body);font-weight:600;font-size:16px;line-height:1.3}
.tool p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.meta b{color:var(--mist);font-weight:500}
.open{margin-top:auto;align-self:flex-start;display:inline-flex;gap:8px;align-items:center;text-decoration:none;font-weight:600;font-size:13px;
  padding:7px 14px;border-radius:8px;border:1px solid var(--neon);color:var(--text);background:rgba(71,171,224,.12)}
.open:hover{background:rgba(71,171,224,.24)}
.open[aria-disabled="true"]{border-color:var(--line-hi);color:var(--muted);background:none;cursor:default}

/* forms & tables */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.card{border:1px solid var(--line-hi);border-radius:14px;background:rgba(1,11,41,.65);padding:20px}
.card h2{font-family:var(--f-label);font-size:20px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
form{display:grid;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:6px;font-size:12.5px;font-weight:600;color:var(--mist);letter-spacing:.02em}
input[type=text],select,textarea{width:100%;background:rgba(0,4,21,.75);border:1px solid var(--line-hi);border-radius:8px;padding:10px 12px;outline:none}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(90,178,243,.15)}
textarea{min-height:110px;resize:vertical}
.err{color:var(--crit);font-size:12.5px;min-height:1em}
.btn{justify-self:start;cursor:pointer;border:0;border-radius:8px;padding:11px 20px;font-weight:600;color:#00122e;
  background:linear-gradient(180deg,#7cc4f5,#3A9FDA);box-shadow:0 0 18px rgba(90,178,243,.35)}
.btn:hover{filter:brightness(1.08)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--f-label);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-size:13px;
  padding:8px 10px;border-bottom:1px solid var(--line-hi);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.id{font-variant-numeric:tabular-nums;color:var(--ice);white-space:nowrap}
.prio{font-weight:600;font-size:12px}
.prio.P1{color:var(--crit)}.prio.P2{color:var(--warn)}.prio.P3{color:var(--ice)}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.docs{display:grid;gap:10px}
.doc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;border-radius:12px;border:1px solid var(--line-hi);background:rgba(1,11,41,.6)}
.doc .ext{width:44px;height:52px;border-radius:6px;border:1px solid var(--circuit);display:grid;place-items:end center;padding-bottom:6px;
  font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--ice);background:linear-gradient(180deg,rgba(45,108,180,.25),rgba(1,11,41,.4))}
.doc h3{font-size:15px;font-weight:600}
.doc small{color:var(--muted);font-size:12.5px}
.toast{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;padding:12px 18px;border-radius:10px;
  background:var(--bg-3);border:1px solid var(--neon);box-shadow:var(--glow);font-weight:500;transform:translateY(20px);opacity:0;transition:.3s;pointer-events:none}
.toast.show{transform:none;opacity:1}

/* view entrance */
.view{animation:rise .5s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- pillar animation primitives ---------- */
.v-scroll{animation:vscroll 6s linear infinite}
.v-scroll.slow{animation-duration:9s}
@keyframes vscroll{to{transform:translateX(-160px)}}
.v-spin{transform-box:view-box;transform-origin:80px 50px;animation:spin 14s linear infinite}
.v-spin.rev{animation-direction:reverse;animation-duration:20s}
.v-spin.fast{animation-duration:7s}
@keyframes spin{to{transform:rotate(360deg)}}
.v-breathe{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.85}}
.v-scan{animation:scan 3.4s ease-in-out infinite}
@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(46px)}100%{transform:translateY(0)}}
.v-dash{stroke-dasharray:4 4;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}

@media (max-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .rail{transform:translateX(-102%);box-shadow:none}
  body.nav-open .rail{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.6)}
  body.nav-open .scrim{display:block;position:fixed;inset:0;z-index:45;background:rgba(0,4,21,.6)}
  .topbar{display:flex}
  main{margin-left:0}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
  .hero,.p-head,.two{grid-template-columns:minmax(0,1fr)}
  .hub-wrap{order:-1;max-width:520px;width:100%;margin:0 auto}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .help-band{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .grid,.tools{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:minmax(0,1fr)}
  .result{grid-template-columns:minmax(0,1fr) auto}.result .r-ic{display:none}
  .doc{grid-template-columns:auto minmax(0,1fr)}.doc .open{grid-column:2}
  .note{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<aside class="rail" id="rail" aria-label="Pillars">
  <a class="brand" href="#home">
    <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true">
      <circle cx="18" cy="18" r="15" fill="none" stroke="#2D6CB4" stroke-width="1.2" stroke-dasharray="3 3"/>
      <circle cx="18" cy="18" r="9.5" fill="rgba(3,19,64,.8)" stroke="#5AB2F3" stroke-width="1.8"/>
      <path d="M13.5 20.5l3-4 2.5 2.5 3.5-5" fill="none" stroke="#BCDFF3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="brand-txt">Supply Chain<span>Analytics Hub</span></div>
  </a>
  <nav class="nav" id="nav"></nav>
  <div class="rail-foot"><span class="dot-live"></span><b>All systems normal</b><br>Data refreshed nightly · 02:00 CT</div>
</aside>
<div class="scrim" id="scrim"></div>

<main>
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Open navigation" aria-controls="rail" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="brand-txt">Supply Chain<span>Analytics Hub</span></div>
  </div>
  <div class="wrap" id="view"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ CONFIG: replace "#" with real dashboard / document URLs ============ */
const PILLARS = [

    <div class="hub-wrap"><canvas id="hub" aria-label="Animated hub linking the eight pillars" role="img"></canvas></div>
  </section>
  <div class="results" id="results" hidden></div>
  <div class="sec-h"><h2>Pillars</h2><p>Select a pillar to see its tools, or use the side navigation.</p></div>
  <div class="grid">${PILLARS.map(p=>`<a class="pillar" href="#${p.id}">
     <div class="vis">${vis(p.id)}</div>
     <div class="body"><h3>${esc(p.name)}</h3><p>${esc(p.blurb)}</p>
     <div class="foot"><span>${p.tools?`${p.tools.length} tools`:p.id==="documents"?`${DOCS.length} documents`:"Create ticket"}</span><i>→</i></div></div></a>`).join("")}</div>
  <div class="help-band">
    <a class="help" href="#service-requests"><div class="node">${ico("service-requests")}</div><div><b>Need something new?</b><span>Request a dashboard, report a data issue or ask for access.</span></div></a>
    <a class="help" href="#documents"><div class="node">${ico("documents")}</div><div><b>Not sure what a metric means?</b><span>Check the KPI handbook and data dictionary.</span></div></a>
  </div>`;
}
function viewPillar(p){
  const types=[...new Set(p.tools.map(t=>t.t))];
  return `<section class="p-head"><div>
    <div class="kicker ruled">Analytics pillar · ${p.tools.length} tools</div>
    <h1 class="d-title">${esc(p.name)}</h1><p>${esc(p.lede)}</p></div>
    <div class="p-vis">${vis(p.id)}</div></section>
  <div class="toolbar" role="group" aria-label="Filter by type">
    <button class="chip" aria-pressed="true" data-f="All">All</button>${types.map(t=>`<button class="chip" aria-pressed="false" data-f="${esc(t)}">${esc(t)}</button>`).join("")}
    <span class="note">Sample catalog. Set each tool's link in the page config.</span></div>
  <div class="tools" id="tools">${p.tools.map(t=>toolCard({...t,p})).join("")}</div>`;
}
function viewTickets(){
  const opts=ANALYTICS.map(p=>`<option>${esc(p.name)}</option>`).join("");
  return `<section class="p-head"><div>
    <div class="kicker ruled">Support</div><h1 class="d-title">Service <span class="accent">Requests</span></h1>
    <p>${esc(P("service-requests").lede)} Each ticket gets an ID you can quote to the analytics team.</p></div>
    <div class="p-vis">${vis("service-requests")}</div></section>
  <div class="two">
    <div class="card"><h2>Create a ticket</h2>
      <form id="tform" novalidate>
        <div class="row">
          <label for="t-type">Request type<select id="t-type"><option>New dashboard or report</option><option>Data issue</option><option>Access request</option><option>Enhancement</option><option>Question</option></select></label>
          <label for="t-pillar">Pillar<select id="t-pillar">${opts}<option>Not sure</option></select></label>
        </div>
        <label for="t-title">Summary<input id="t-title" type="text" maxlength="120" placeholder="e.g. Past-due tracker missing one supplier site"></label>
        <label for="t-desc">Details<textarea id="t-desc" placeholder="What do you need, which tool, and who is affected?"></textarea></label>
        <div class="row">
          <label for="t-prio">Priority<select id="t-prio"><option value="P3">P3 · Normal</option><option value="P2">P2 · Affects a team</option><option value="P1">P1 · Blocks a build or shipment</option></select></label>
          <label for="t-name">Your name<input id="t-name" type="text" maxlength="60" placeholder="First Last"></label>
        </div>
        <div class="err" id="terr"></div>
        <button class="btn" type="submit">Create ticket</button>
      </form></div>
    <div class="card"><h2>Recent tickets</h2>
      <div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Summary</th><th>Pillar</th><th>Priority</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div>
      <p class="note" style="margin:12px 0 0">Tickets you create are saved in this browser. Rows marked sample are examples.</p></div>
  </div>`;
}
function renderTickets(){
  const rows=tickets();
  $("#tbody").innerHTML=rows.length?rows.map(t=>`<tr><td class="id">${esc(t.id)}</td><td>${esc(t.title)}<br><small style="color:var(--muted)">${esc(t.type)} · ${esc(t.when)}${t.sample?" · sample":""}</small></td>
    <td>${esc(t.pillar)}</td><td class="prio ${t.prio}">${t.prio}</td><td><span class="pill ${t.status==="New"?"beta":"live"}">${esc(t.status)}</span></td></tr>`).join("")
    :`<tr><td colspan="5" class="empty">No tickets yet. Create one on the left.</td></tr>`;
}
function viewDocs(){
  const cats=[...new Set(DOCS.map(d=>d.c))];
  return `<section class="p-head"><div>
    <div class="kicker ruled">Support · ${DOCS.length} documents</div><h1 class="d-title">Docu<span class="accent">ments</span></h1>
    <p>${esc(P("documents").lede)}</p></div><div class="p-vis">${vis("documents")}</div></section>
  <div class="toolbar" role="group" aria-label="Filter by category"><button class="chip" aria-pressed="true" data-f="All">All</button>
    ${cats.map(c=>`<button class="chip" aria-pressed="false" data-f="${esc(c)}">${esc(c)}</button>`).join("")}<span class="note">Sample library. Set each document's link in the page config.</span></div>
  <div class="docs" id="docs">${DOCS.map(d=>`<article class="doc" data-type="${esc(d.c)}"><div class="ext">${d.x}</div>
    <div style="min-width:0"><h3>${esc(d.n)}</h3><small>${esc(d.c)} · Updated ${esc(d.up)}</small><p style="margin:4px 0 0;color:var(--muted);font-size:13.5px">${esc(d.d)}</p></div>
    ${openBtn(d.u,"View")}</article>`).join("")}</div>`;
}

/* ============ router ============ */
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
let hubStop=null;
function route(){
  const id=(location.hash||"#home").slice(1);
  const p=P(id); const v=$("#view");
  if(hubStop){hubStop();hubStop=null}
  let key=id;
  if(id==="service-requests"){v.innerHTML=viewTickets();bindTickets()}
  else if(id==="documents"){v.innerHTML=viewDocs();bindChips("#docs .doc")}
  else if(p&&p.tools){v.innerHTML=viewPillar(p);bindChips("#tools .tool")}
  else{key="home";v.innerHTML=viewHome();bindSearch();hubStop=startHub()}
  v.classList.remove("view");void v.offsetWidth;v.classList.add("view");
  if(reduced)v.querySelectorAll("svg").forEach(s=>s.pauseAnimations&&s.pauseAnimations());
  setNav(key);closeNav();
  document.title=(key==="home"?"":(P(key).name+" · "))+"Supply Chain Analytics Hub";
  window.scrollTo(0,0);
}
function bindChips(sel){
  document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
    document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));
    const f=c.dataset.f; document.querySelectorAll(sel).forEach(el=>el.hidden=!(f==="All"||el.dataset.type===f));
  }));
}
function bindSearch(){
  const q=$("#q"),box=$("#results");
  q.addEventListener("input",()=>{
    const s=q.value.trim().toLowerCase();
    if(!s){box.hidden=true;return}
    const hits=ALL_TOOLS.filter(t=>(t.n+" "+t.d+" "+t.p.name+" "+t.t).toLowerCase().includes(s)).slice(0,8);
    box.hidden=false;
    box.innerHTML=hits.length?hits.map(t=>`<a class="result" href="#${t.p.id}"><div class="node r-ic" style="width:38px;height:38px">${ico(t.p.id)}</div>
      <div style="min-width:0"><b>${esc(t.n)}</b><br><small>${esc(t.p.name)} · ${esc(t.t)} · ${esc(t.d)}</small></div><span class="pill ${t.s}">${{live:"Live",beta:"Beta",planned:"Planned"}[t.s]}</span></a>`).join("")
      :`<div class="result" style="grid-template-columns:1fr"><span>No tool matches “${esc(q.value)}”. <a href="#service-requests" style="color:var(--neon)">Request a new one</a>.</span></div>`;
  });
}
function bindTickets(){
  renderTickets();
  $("#tform").addEventListener("submit",e=>{
    e.preventDefault();
    const title=$("#t-title").value.trim(), desc=$("#t-desc").value.trim(), name=$("#t-name").value.trim();
    if(title.length<6){$("#terr").textContent="Add a summary of at least 6 characters so the team can triage it.";$("#t-title").focus();return}
    if(!name){$("#terr").textContent="Add your name so the team knows who to contact.";$("#t-name").focus();return}
    $("#terr").textContent="";
    const mine=store.get("hub.tickets",[]);
    const n=1043+mine.length;
    const d=new Date();
    const t={id:"SR-"+n,title,desc,name,type:$("#t-type").value,pillar:$("#t-pillar").value,prio:$("#t-prio").value,status:"New",
      when:d.toLocaleDateString("en-US",{month:"short",day:"numeric"})};
    store.set("hub.tickets",[t,...mine]);
    e.target.reset(); renderTickets(); toast(`Ticket ${t.id} created`);
  });
}

/* ============ hero hub canvas ============ */
function startHub(){
  const cv=$("#hub"); if(!cv) return null;
  const ctx=cv.getContext("2d"); let W,H,raf,t0=performance.now(),parts=[];
  const labels=PILLARS.map(p=>p.name.replace("Service Requests","Requests").replace("Supply & Demand","S&D").toUpperCase());
  function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size(); const ro=new ResizeObserver(size); ro.observe(cv);
  for(let i=0;i<70;i++)parts.push({k:i%8,p:Math.random(),v:.0018+Math.random()*.0035,o:Math.random()*.6-.3});
  function nodes(t){const cx=W/2,cy=H/2,rx=W*.4,ry=H*.38;return labels.map((l,i)=>{const a=-Math.PI/2+i*Math.PI*2/8+t*.00004;return{x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry,l}})}
  function glow(c,b){ctx.shadowColor=c;ctx.shadowBlur=b}
  function frame(now){
    const t=now-t0, cx=W/2, cy=H/2, R=Math.min(W,H);
    ctx.clearRect(0,0,W,H);
    const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.6);bg.addColorStop(0,"rgba(7,56,142,.55)");bg.addColorStop(1,"rgba(0,4,21,0)");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    const N=nodes(t);
    // traces
    ctx.lineWidth=1;N.forEach(n=>{ctx.strokeStyle="rgba(45,108,180,.45)";ctx.beginPath();ctx.moveTo(n.x,n.y);const mx=(n.x+cx)/2;ctx.lineTo(mx,n.y);ctx.lineTo(cx+(n.x-cx)*.22,cy+(n.y-cy)*.22);ctx.stroke()});
    // particles
    parts.forEach(p=>{p.p+=p.v;if(p.p>1)p.p=0;const n=N[p.k];const mx=(n.x+cx)/2;let x,y;const ex=cx+(n.x-cx)*.22,ey=cy+(n.y-cy)*.22;
      if(p.p<.5){const q=p.p/.5;x=n.x+(mx-n.x)*q;y=n.y}else{const q=(p.p-.5)/.5;x=mx+(ex-mx)*q;y=n.y+(ey-n.y)*q}
      const a=Math.sin(p.p*Math.PI);glow("#5AB2F3",8);ctx.fillStyle=`rgba(188,223,243,${(.35+.65*a).toFixed(2)})`;ctx.beginPath();ctx.arc(x,y+p.o,1.6,0,7);ctx.fill()});
    ctx.shadowBlur=0;
    // rings
    const rings=[[.3,.0003,[6,10],"rgba(90,178,243,.55)"],[.24,-.0005,[2,6],"rgba(133,186,232,.6)"],[.36,.00018,[30,18],"rgba(123,108,246,.35)"]];
    rings.forEach(([r,s,d,c])=>{ctx.save();ctx.translate(cx,cy);ctx.rotate(t*s);ctx.setLineDash(d);ctx.strokeStyle=c;ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,0,R*r*.5,0,Math.PI*2);ctx.stroke();ctx.restore()});
    ctx.setLineDash([]);
    // core
    const pulse=.5+.5*Math.sin(t*.002);
    glow("#5AB2F3",30*pulse+10);ctx.strokeStyle="#5AB2F3";ctx.lineWidth=2.5;ctx.fillStyle="#031340";
    ctx.beginPath();ctx.arc(cx,cy,R*.085,0,7);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    ctx.strokeStyle="#BCDFF3";ctx.lineWidth=2;ctx.lineCap="round";ctx.lineJoin="round";const s=R*.03;
    ctx.beginPath();ctx.moveTo(cx-s*1.3,cy+s*.7);ctx.lineTo(cx-s*.4,cy-s*.2);ctx.lineTo(cx+s*.3,cy+s*.4);ctx.lineTo(cx+s*1.3,cy-s*.9);ctx.stroke();
    // nodes
    const fs=Math.max(9,R*.026);ctx.font=`600 ${fs}px "Barlow Condensed", sans-serif`;ctx.textAlign="center";
    N.forEach((n,i)=>{const r=Math.max(7,R*.022);glow("#5AB2F3",12);ctx.fillStyle="#031340";ctx.strokeStyle=i>=6?"#7B6CF6":"#5AB2F3";ctx.lineWidth=1.6;
      ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle="#BCDFF3";ctx.beginPath();ctx.arc(n.x,n.y,r*.35,0,7);ctx.fill();
      ctx.fillStyle="#C3CFDF";const below=n.y>cy;ctx.fillText(n.l.split("").join(String.fromCharCode(8202)),n.x,n.y+(below?r+fs+2:-r-6))});
    if(!reduced)raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  return ()=>{cancelAnimationFrame(raf);ro.disconnect()};
}

/* ============ boot ============ */
buildNav();
$("#menuBtn").addEventListener("click",()=>{const o=document.body.classList.toggle("nav-open");$("#menuBtn").setAttribute("aria-expanded",o)});
$("#scrim").addEventListener("click",closeNav);
addEventListener("keydown",e=>{if(e.key==="Escape")closeNav();if(e.key==="/"&&$("#q")&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();$("#q").focus()}});
addEventListener("hashchange",route);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
route();
</script>
